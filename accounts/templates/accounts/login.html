{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบ - สวนใบไม้{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-3 text-center">เข้าสู่ระบบ</h3>
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    {{ form.username.errors }}
                    <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="id_password">Password</label>
                    {{ form.password.errors }}
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
            </form>
            <p class="mt-3 text-center mb-0">
                ยังไม่มีบัญชี? <a href="{% url 'accounts:register' %}">สมัครสมาชิก</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
