{% extends 'base.html' %}
{% block title %}สั่งซื้อสำเร็จ - สวนใบไม้{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
    <h2 class="mt-3">สั่งซื้อสำเร็จ!</h2>
    <p class="text-muted">หมายเลขคำสั่งซื้อของคุณคือ #{{ order.id }}</p>
    <p>ยอดรวมทั้งหมด: <strong>{{ order.total_price }} บาท</strong></p>
    <div class="mt-4">
        <a href="{% url 'orders:order_detail' order.id %}" class="btn btn-primary">ดูรายละเอียดคำสั่งซื้อ</a>
        <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary">เลือกซื้อสินค้าต่อ</a>
    </div>
</div>
{% endblock %}
